version: '3.8'

services:
  fastapi:
    build: ./fastapi_server
    networks:
      - app_network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./fastapi_server:/app
    restart: always

  celery_worker:
    build: ./fastapi_server
    command: celery -A celery_tasks worker --loglevel=info
    networks:
      - app_network
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./fastapi_server:/app
    restart: always

  redis:
    image: redis:latest
    networks:
      - app_network
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - app_network
    depends_on:
      - fastapi
    command: [nginx-debug, '-g', 'daemon off;']
    restart: always

networks:
  app_network:
    driver: bridge 